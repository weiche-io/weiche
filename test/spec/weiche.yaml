apiVersion: v1
kind: Namespace
metadata:
  name: weiche-spec
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weiche
  namespace: weiche-spec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: weiche-spec
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, httproutes, tcproutes, udproutes, referencegrants, backendtlspolicies]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses/status, gateways/status, httproutes/status, tcproutes/status, udproutes/status, backendtlspolicies/status]
    verbs: [get, patch]
  - apiGroups: ['']
    resources: [services, namespaces]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [configmaps, secrets]
    verbs: [list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: weiche-spec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: weiche-spec
subjects:
  - kind: ServiceAccount
    name: weiche
    namespace: weiche-spec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weiche-services
  namespace: weiche-spec
rules:
  - apiGroups: ['']
    resources: [services]
    verbs: [create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weiche-services
  namespace: weiche-spec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: weiche-services
subjects:
  - kind: ServiceAccount
    name: weiche
    namespace: weiche-spec
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: weiche
spec:
  controllerName: weiche.io/gateway-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weiche
  namespace: weiche-spec
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weiche
  template:
    metadata:
      labels:
        app: weiche
    spec:
      serviceAccountName: weiche
      terminationGracePeriodSeconds: 10
      containers:
        - name: weiche
          image: localhost/weiche:spec
          imagePullPolicy: Never
          env:
            - name: WEICHE_MANAGE_GATEWAYS
              value: "true"
            - name: WEICHE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # the gateway worker needs io_uring in the kind node.
            seccompProfile:
              type: Unconfined
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
