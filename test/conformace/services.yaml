apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weiche-services
  namespace: weiche-demo
rules:
  - apiGroups: ['']
    resources: [services]
    verbs: [create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weiche-services
  namespace: weiche-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: weiche-services
subjects:
  - kind: ServiceAccount
    name: weiche
    namespace: weiche-demo
