# Helm overrides for the disposable conformance cluster.
image:
  repository: localhost/weiche
  tag: spec
  pullPolicy: Never
gatewayNamespaces:
  - gateway-conformance-infra
controller:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
proxy:
  # keep one ring per proxy on kernels that charge io_uring queues to the shared uid.
  extraEnv:
    - name: WEICHE_WORKERS
      value: "1"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
