name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
  packages: write
jobs:
  test:
    if: ${{ !github.event.deleted }}
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
  image:
    needs: test
    uses: ./.github/workflows/image.yml
  helm:
    needs: image
    uses: ./.github/workflows/helm.yml
