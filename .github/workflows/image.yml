name: Image release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build image
        run: |
          yq -oy -e '.package.version == strenv(TAG)' weiche/Cargo.toml
          yq -e '.version == strenv(TAG) and .appVersion == strenv(TAG)' charts/weiche/Chart.yaml
          docker build -t "ghcr.io/${GITHUB_REPOSITORY,,}:$TAG" .
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - run: docker push "ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"
