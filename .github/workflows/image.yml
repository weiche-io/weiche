name: Image release
on:
  workflow_call:
permissions:
  contents: read
  packages: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            cache: buildkit
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache: buildkit-arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      amd64: ${{ steps.digest.outputs.amd64 }}
      arm64: ${{ steps.digest.outputs.arm64 }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release version
        run: |
          yq -oy -e '.package.version == strenv(TAG)' weiche/Cargo.toml
          yq -e '.version == strenv(TAG) and .appVersion == strenv(TAG)' charts/weiche/Chart.yaml
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - &login
        name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - &buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,push=true
      - name: Export platform digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${{ matrix.arch }}=$DIGEST" >> "$GITHUB_OUTPUT"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - *login
      - *buildx
      - name: Publish multi-platform tag
        env:
          AMD64_DIGEST: ${{ needs.build.outputs.amd64 }}
          ARM64_DIGEST: ${{ needs.build.outputs.arm64 }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:$GITHUB_REF_NAME" \
            "$image@$AMD64_DIGEST" "$image@$ARM64_DIGEST"
