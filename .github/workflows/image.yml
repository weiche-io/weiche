name: Image release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release version
        run: |
          yq -oy -e '.package.version == strenv(TAG)' weiche/Cargo.toml
          yq -e '.version == strenv(TAG) and .appVersion == strenv(TAG)' charts/weiche/Chart.yaml
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$TAG" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          push: true
