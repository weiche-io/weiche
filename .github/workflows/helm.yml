name: Helm release
on:
  workflow_call:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Package chart
        run: |
          yq -oy -e '.package.version == strenv(TAG)' weiche/Cargo.toml
          yq -e '.version == strenv(TAG) and .appVersion == strenv(TAG)' charts/weiche/Chart.yaml
          helm lint --strict charts/weiche
          helm package charts/weiche --destination target/helm
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push chart to GHCR
        shell: bash
        run: |
          for delay in 0 5 15; do
            sleep "$delay"
            if helm push "target/helm/weiche-$TAG.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" 2>&1 | tee "$RUNNER_TEMP/helm-push.log"; then
              exit 0
            fi
            # GHCR can briefly return 404 when Helm reads the manifest it just pushed.
            grep -Eq 'failed to perform "Tag" on destination: sha256:[[:xdigit:]]+: not found' "$RUNNER_TEMP/helm-push.log" || exit 1
          done
          exit 1
