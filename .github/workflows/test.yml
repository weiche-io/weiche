name: test
on:
  workflow_call:
  pull_request:
    paths: &weiche
      - 'weiche/**'
      - 'weiche-gtwapi/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      # no test.yml since it's expensive to test
      # - '.github/workflows/test.yml'
  # warm branch caches on master so new pull requests reuse them.
  push:
    branches: [master]
    paths: *weiche
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            cache: buildkit
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache: buildkit-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: tools
        with:
          path: |
            target/conformance/conformance.test
            target/conformance/kind-*
          key: conformance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('weiche-gtwapi/manifests/source.json', 'mk/conformance.mk') }}
      - if: steps.tools.outputs.cache-hit == 'true'
        run: touch target/conformance/conformance.test
      - if: steps.tools.outputs.cache-hit != 'true'
        run: make conformance-source
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.tools.outputs.cache-hit != 'true'
        with:
          go-version-file: target/conformance/gateway-api/go.work
          cache: false
      - if: steps.tools.outputs.cache-hit != 'true'
        run: make conformance-tools
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: localhost/weiche:spec
          load: true
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max
      - if: github.event_name == 'pull_request' || github.ref_type == 'tag'
        run: make IMAGE=localhost/weiche:spec conformance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('target/conformance/report.yaml') != '' }}
        with:
          name: gateway-api-report-${{ matrix.arch }}
          path: target/conformance/report.yaml
          if-no-files-found: error
