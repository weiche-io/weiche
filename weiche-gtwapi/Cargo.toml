[package]
name = "weiche-gtwapi"
version = "1.7.0"
edition = "2024"
rust-version = "1.92"
description = "Rust bindings generated from the upstream Kubernetes Gateway API manifests"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
k8s-openapi = "0.29"
kube = { version = "5", default-features = false, features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
k8s-openapi = { version = "0.29", features = ["v1_37"] }
