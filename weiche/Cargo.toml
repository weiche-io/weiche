[package]
name = "weiche"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
description = "A Kubernetes networking gateway"

[features]
quic = []

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
compio = { version = "0.20.0-beta.1", features = ["net", "time", "ring", "h3"] }
cyper-core = { git = "https://github.com/compio-rs/cyper", rev = "dde9bdc7787effd98c4dff18b8b58970ec10b5f6", default-features = false }
fastrand = "2"
flate2 = "1"
form_urlencoded = "1.2.2"
futures = "0.3"
http = "1"
http-serde-ext = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = [
    "server-auto",
    "tokio",
] }
insomnilog = "0.3"
k8s-openapi = { version = "0.29", features = ["v1_37"] }
kube = { version = "5", default-features = false, features = [
    "client",
    "runtime",
    "rustls-tls",
    "ring",
] }
kube-lease-manager = "0.13"
libc = "0.2"
regex = "1.13.1"
ring = "0.17"
rmp-serde = "1"
rustls-native-certs = "0.8"
send_wrapper = "0.6"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = [
    "macros",
    "rt",
    "io-util",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
weiche-gtwapi = { version = "=1.7.0", path = "../weiche-gtwapi" }

[dev-dependencies]
http-body = "1"
tower = { version = "0.5", features = ["util"] }
