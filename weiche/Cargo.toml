[package]
name = "weiche"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A Kubernetes networking gateway"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
compio = { version = "0.19.2", features = ["net", "io-compat", "time"] }
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
k8s-openapi = { version = "0.29", features = ["v1_37"] }
kube = { version = "5", default-features = false, features = [
    "client",
    "runtime",
    "rustls-tls",
    "ring",
] }
serde = "1"
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
weiche-gtwapi = { version = "=1.7.0", path = "../weiche-gtwapi" }

[dev-dependencies]
http-body = "1"
tower = { version = "0.5", features = ["util"] }
