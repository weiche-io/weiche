[package]
name = "weiche"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A Kubernetes networking gateway"

[dependencies]
anyhow = "1"
futures = "0.3"
k8s-openapi = { version = "0.29", features = ["v1_37"] }
kube = { version = "5", default-features = false, features = [
    "client",
    "runtime",
    "rustls-tls",
    "ring",
] }
serde = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
weiche-gtwapi = { version = "=1.7.0", path = "../weiche-gtwapi" }

[dev-dependencies]
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tower = { version = "0.5", features = ["util"] }
