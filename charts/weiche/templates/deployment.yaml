apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: {{ .Values.controllerReplicas }}
  selector:
    matchLabels:
      app: weiche
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      annotations:
        weiche.io/settings: {{ include (print $.Template.BasePath "/settings.yaml") . | sha256sum }}
      labels:
        app: weiche
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      serviceAccountName: {{ .Release.Name | quote }}
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: settings
          configMap:
            name: {{ .Release.Name }}-settings
      containers:
        - name: weiche
          image: {{ printf "%s:%s" .Values.image.repository (default .Chart.AppVersion .Values.image.tag | toString) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [controller]
          volumeMounts:
            - name: settings
              mountPath: /etc/weiche
              readOnly: true
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources: {{- toYaml .Values.resources | nindent 12 }}
