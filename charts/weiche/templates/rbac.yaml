{{- $fullname := include "weiche.fullname" . -}}
{{- $controllerRole := include "weiche.controllerRole" . -}}
{{- $provisionerRole := include "weiche.provisionerRole" . -}}
{{- $electionRole := include "weiche.electionRole" . -}}
{{- $leaseName := include "weiche.leaseName" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname | quote }}
  namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $controllerRole | quote }}
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, httproutes, grpcroutes, tcproutes, tlsroutes, udproutes, referencegrants, backendtlspolicies]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses/status, gateways/status, httproutes/status, grpcroutes/status, tcproutes/status, tlsroutes/status, udproutes/status, backendtlspolicies/status]
    verbs: [get, patch]
  - apiGroups: ['']
    resources: [services, namespaces]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [configmaps, secrets]
    verbs: [list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $controllerRole | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $controllerRole | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullname | quote }}
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $electionRole | quote }}
  namespace: {{ .Release.Namespace | quote }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ $leaseName | quote }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $electionRole | quote }}
  namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $electionRole | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullname | quote }}
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $provisionerRole | quote }}
rules:
  - apiGroups: ['']
    resources: [services, secrets, configmaps, serviceaccounts]
    verbs: [get, create, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, create, patch, delete]
{{- range .Values.gatewayNamespaces | default (list .Release.Namespace) | uniq }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $provisionerRole | quote }}
  namespace: {{ . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $provisionerRole | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullname | quote }}
    namespace: {{ $.Release.Namespace | quote }}
{{- end }}
