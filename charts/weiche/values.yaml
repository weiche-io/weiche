image:
  repository: ghcr.io/weiche-io/weiche
  # Empty uses appVersion from Chart.yaml.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Workers need a seccomp profile that permits io_uring.
seccompProfile:
  type: Unconfined

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi
